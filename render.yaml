services:
  # 1. Backend REST API Service
  - type: web
    name: smart-queue-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set in Render dashboard (e.g., your MongoDB Atlas connection URI)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_URL
        sync: false # Set to your frontend URL
      - key: SMS_ENABLED
        value: "false"

  # 2. Frontend Static Site
  - type: web
    name: smart-queue-client
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to your backend service URL (e.g., https://smart-queue-server.onrender.com/api/v1)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

